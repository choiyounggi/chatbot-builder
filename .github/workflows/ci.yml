name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The engine this builder is built and tested against (chatbot-engine commit).
  ENGINE_REF: 89f1ab56cb364ae10b4409e716d902e3a5ed636d

jobs:
  check:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: choiyounggi/chatbot-engine
          ref: ${{ env.ENGINE_REF }}
          path: engine
          sparse-checkout: docs/openapi.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: API types match the pinned engine's schema
        run: |
          ENGINE_OPENAPI=engine/docs/openapi.json npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run check
      - run: npm run build

  e2e:
    name: End-to-end with the engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: choiyounggi/chatbot-engine
          ref: ${{ env.ENGINE_REF }}
          path: engine
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: npm ci
      - run: uv sync --locked --directory engine
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          ENGINE_DIR: engine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
